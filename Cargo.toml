[package]
name = "puddi"
version = "0.1.2"
edition = "2024"
description = "Compiler and toolchain for the Puddi programming language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/puddi-lang/puddi"

[[bin]]
name = "pud"
path = "src/main.rs"

[dependencies]
wat = "1.263"
wasmparser = "0.263"
wasm-encoder = "0.263"
toml = "1.2"
serde = { version = "1", features = ["derive"] }
wit-parser = "0.263"
wit-component = "0.263"
wasmtime = { version = "50", features = ["component-model", "component-model-async", "gc", "gc-copying", "gc-drc", "cranelift", "incremental-cache"], optional = true }
wasmtime-wasi = { version = "50", features = ["p3"], optional = true }
wasmtime-wasi-http = { version = "50", features = ["p3"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
semver = "1"

[profile.release]
opt-level = 3

[features]
default = ["runtime"]
# Embedded WASI 0.3 runtime used by `pud run --target wasi`.
runtime = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wasmtime-wasi-http", "dep:tokio"]
